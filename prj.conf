# --- KONSOLA I LOGOWANIE ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

# --- OBSŁUGA UART/USB DLA ESP32 ---
# CONFIG_UART_ESP32=y
# CONFIG_UART_INTERRUPT_DRIVEN=y

# --- KOMUNIKACJA ---
CONFIG_CAN=y
CONFIG_I2C=y
CONFIG_CAN_MANUAL_RECOVERY_MODE=y

# --- PERYFERIA SPRZĘTOWE ---
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y

# --- CZUJNIKI ---
CONFIG_SENSOR=y
CONFIG_BME280=y

# --- BEZPIECZEŃSTWO ---
CONFIG_WATCHDOG=y

# --- PAMIĘĆ NIEULOTNA (FLASH / NVS) ---
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y